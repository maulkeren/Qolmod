name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Susun folder proyek
        run: |
          mkdir -p app/src/main/java/com/example/qolmod app/src/main/assets
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.kt OverlayService.kt app/src/main/java/com/example/qolmod/
          mv menu.html app/src/main/assets/
          mv app-build.gradle.kts app/build.gradle.kts

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk QOLMOD.apk
          gh release create "v${{ github.run_number }}" QOLMOD.apk \
            --title "QOLMOD build ${{ github.run_number }}" \
            --notes "APK debug"
